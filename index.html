<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="塔羅占卜">
    <link rel="apple-touch-icon" href="icon.png">
    <title>塔羅占卜</title>
    
    <script src="data.js"></script>

    <style>
        :root {
            /* 淺色主題配色變數 */
            --gold: #b8933a; /* 稍微加深金色以適應淺色背景 */
            --gold-shadow: rgba(184, 147, 58, 0.3);
            --bg-light: #f8f9fa; 
            --text-dark: #333333;
            --text-grey: #555555;
            --card-w: 64px;
            --card-h: 108px;
        }

        body {
            background-color: var(--bg-light);
            /* 改為淺色明亮的漸層背景 */
            background-image: linear-gradient(to bottom, #ffffff 0%, #e9ecef 100%);
            color: var(--text-dark); 
            font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
        }

        /* 介面與引導 */
        #intro-ui { text-align: center; z-index: 1500; width: 85%; }
        h1 { 
            color: var(--gold); 
            font-size: 2rem; 
            letter-spacing: 6px; 
            margin-bottom: 35px; 
            font-weight: bold;
            text-shadow: 1px 1px 2px var(--gold-shadow);
        }
        
        .spread-menu { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .spread-btn {
            padding: 16px;
            background: rgba(255, 255, 255, 0.9); /* 淺色半透明背景 */
            color: var(--gold);
            border: 1px solid var(--gold);
            border-radius: 12px;
            font-size: 1.1rem;
            text-align: center; 
            font-weight: 600;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .spread-btn:active { background: var(--gold); color: white; }

        #guide-msg {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 10px);
            width: 100%;
            text-align: center;
            padding: 10px;
            color: var(--gold);
            font-size: 1.05rem;
            font-weight: bold;
            z-index: 4000;
            display: none;
            /* 在淺色背景上增加文字陰影以提高辨識度 */
            text-shadow: 0 1px 2px rgba(255,255,255,1), 0 0 10px rgba(184, 147, 58, 0.2);
        }

        /* 卡牌容器 */
        .deck-container { position: relative; width: 100%; height: 100%; display: none; }

        .card {
            width: var(--card-w);
            height: var(--card-h);
            position: absolute;
            left: calc(50% - var(--card-w)/2);
            top: 45%;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            z-index: 10;
            /* 增加卡牌陰影，使其在淺色背景上更立體 */
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border-radius: 6px;
        }

        .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s; }

        /* 標籤樣式：側邊直式，增加深色陰影以適應淺背景 */
        .card-label {
            position: absolute;
            top: 50%;
            right: calc(100% + 6px);
            transform: translateY(-50%);
            white-space: nowrap;
            color: var(--gold);
            font-size: 0.8rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
            writing-mode: vertical-lr;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3); /* 加深陰影 */
        }
        .card.flipped .card-label { opacity: 1; }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card.is-reversed .card-back img { transform: rotate(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            border: 1px solid var(--gold);
            box-sizing: border-box;
            overflow: hidden;
            background: #fff; /* 牌面背景設為白色 */
        }

        /* 牌背居中修正 */
        .card-front { 
            background: #000; /* 牌背邊框保持深色以突出圖案 */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-front img {
            width: 120%; 
            height: 120%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .card-back { background: #fff; transform: rotateY(180deg); }
        .card-back img { width: 101%; height: 101%; object-fit: cover; display: block; }

        /* 解讀面板：改為淺色半透明背景 */
        #result-panel {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.96); /* 淺色背景 */
            padding: 20px 20px calc(env(safe-area-inset-bottom) + 15px) 20px;
            border-top: 2px solid var(--gold); /* 加粗邊框 */
            display: none;
            z-index: 5000;
            overflow-y: auto;
            max-height: 38vh;
            box-sizing: border-box;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1); /* 柔和的陰影 */
        }
    </style>
</head>
<body>

    <div id="guide-msg"></div>

    <div id="intro-ui">
        <h1>塔羅占卜</h1>
        <div class="spread-menu">
            <button class="spread-btn" onclick="prepareDeck(1, 'RESULT')">精準預測</button>
            <button class="spread-btn" onclick="prepareDeck(3, 'TIMELINE')">前因後果</button>
            <button class="spread-btn" onclick="prepareDeck(3, 'RELATION')">人際關係</button>
            <button class="spread-btn" onclick="prepareDeck(5, 'CHOICE')">抉擇判斷</button>
        </div>
    </div>

    <div class="deck-container" id="deck"></div>

    <div id="result-panel">
        <div id="resContent"></div>
        <button style="width:100%; margin-top:15px; background:var(--gold); color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; font-size:1.1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2);" onclick="location.reload()">結束占卜</button>
    </div>

    <script>
        const deckContainer = document.getElementById('deck');
        const guideMsg = document.getElementById('guide-msg');
        let session = { count: 0, type: '', selected: 0, results: [] };
        let cards = [];

        function init() {
            if (typeof tarotDeckData === 'undefined') {
                console.error("data.js 未載入，請確保檔案存在");
                // 這裡可以加入一個假資料用於測試顯示
                window.tarotDeckData = Array.from({length:22}, (_,i)=>({n:`牌名${i}`,u:`正位解釋${i}...`,r:`逆位解釋${i}...`}));
            }
            const indices = Array.from({length: 22}, (_, i) => i).sort(() => Math.random() - 0.5);
            for (let i = 0; i < 22; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.idx = indices[i];
                // 注意：這裡假設你的圖片檔名是 0.jpg 到 21.jpg 以及 back.jpg
                card.innerHTML = `
                    <div class="card-label"></div>
                    <div class="card-inner">
                        <div class="card-face card-front"><img src="back.jpg" class="back-img"></div>
                        <div class="card-face card-back"><img src="${indices[i]}.jpg"></div>
                    </div>`;
                deckContainer.appendChild(card);
                cards.push(card);
            }
        }

        async function prepareDeck(count, type) {
            session = { count, type, selected: 0, results: [] };
            document.getElementById('intro-ui').style.display = 'none';
            deckContainer.style.display = 'block';
            guideMsg.style.display = 'block';
            guideMsg.innerText = "正在進行洗牌儀式...";

            // 洗牌動畫
            for(let r=0; r<3; r++) {
                cards.forEach((c, i) => {
                    const x = i < 11 ? -80 : 80;
                    const isReversing = Math.random() > 0.5;
                    c.dataset.isBackReversed = isReversing ? "true" : "false";
                    c.style.transform = `translate(${x}px, 0)`;
                    const img = c.querySelector('.back-img');
                    img.style.transform = isReversing ? `rotate(180deg)` : `rotate(0deg)`;
                });
                await new Promise(res => setTimeout(res, 600));
                cards.forEach(c => c.style.transform = `translate(0, 0)`);
                await new Promise(res => setTimeout(res, 500));
            }

            // 直線雙排攤牌 - 緊湊版佈局
            cards.forEach((c, i) => {
                let x, y;
                // 調整 Y 軸數值，讓兩排更靠近，適應小螢幕
                if (i < 11) {
                    x = (i - 5) * 32;
                    y = 90;  // 上排位置上移
                } else {
                    x = (i - 16) * 32;
                    y = 170; // 下排位置大幅上移，與上排輕微重疊
                }
                c.style.transform = `translate(${x}px, ${y}px) rotate(0deg)`;
                c.onclick = () => selectCard(c);
            });
            updateGuide();
        }

        function updateGuide() {
            const labels = getLabels(session.type);
            guideMsg.innerText = session.selected < session.count ? 
                `請抽出「${labels[session.selected]}」的牌` : `揭示中...`;
        }

        function selectCard(card) {
            if (card.classList.contains('flipped') || session.selected >= session.count) return;

            const isRev = card.dataset.isBackReversed === "true"; 
            const data = tarotDeckData[card.dataset.idx];
            const labels = getLabels(session.type);
            const currentLabel = labels[session.selected];
            
            session.selected++;
            card.querySelector('.card-label').innerText = currentLabel;
            if (isRev) card.classList.add('is-reversed');
            card.classList.add('flipped');

            // 抽出牌的座標佈局 (向上移動以避開攤牌區)
            let pos = { x: 0, y: -160 }; 

            if (session.type === 'TIMELINE') {
                pos.x = (session.selected - 2) * 85;
                pos.y = -160;
            } 
            else if (session.type === 'RELATION') {
                if (session.selected === 1) pos = { x: -90, y: -160 };
                if (session.selected === 2) pos = { x: 90, y: -160 };
                if (session.selected === 3) pos = { x: 0, y: -160 };
            } 
            else if (session.type === 'CHOICE') {
                if (session.selected === 1) pos = { x: 0, y: -80 };
                if (session.selected === 2) pos = { x: -85, y: -170 };
                if (session.selected === 3) pos = { x: -85, y: -290 };
                if (session.selected === 4) pos = { x: 85, y: -170 };
                if (session.selected === 5) pos = { x: 85, y: -290 };
            }

            card.style.zIndex = 1000 + session.selected;
            card.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(1.0) rotate(0deg)`;

            session.results.push({ label: currentLabel, name: data.n, pos: isRev ? '逆位' : '正位', desc: isRev ? data.r : data.u });

            if (session.selected < session.count) {
                updateGuide();
            } else {
                updateGuide();
                setTimeout(showResult, 1500);
            }
        }

        function getLabels(type) {
            const dict = {
                'RESULT': ['結果'],
                'TIMELINE': ['過去', '現在', '未來'],
                'RELATION': ['你本人', '對方', '關係現狀'],
                'CHOICE': ['現狀', '選項A', '選項A結果', '選項B', '選項B結果']
            };
            return dict[type] || ['啟示'];
        }

        function showResult() {
            guideMsg.style.display = 'none';
            const panel = document.getElementById('result-panel');
            const content = document.getElementById('resContent');
            
            let html = `<h2 style="color:var(--gold); text-align:center; margin:0 0 20px 0; font-size:1.5rem; text-shadow: 1px 1px 1px rgba(0,0,0,0.1);">占卜結果</h2>`;
            
            session.results.forEach(res => {
                html += `
                <div style="margin-bottom:20px; border-bottom:1px solid var(--gold-shadow); padding-bottom:15px;">
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                        <span style="background:var(--gold); color:white; padding:3px 8px; border-radius:4px; font-size:1rem; font-weight:bold; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">${res.label}</span>
                        <b style="color:var(--gold); font-size:1.25rem; text-shadow: 0.5px 0.5px 0px var(--gold-shadow);">${res.name} (${res.pos})</b>
                    </div>
                    <p style="margin:0; font-size:1.15rem; color:var(--text-grey); line-height:1.6;">${res.desc}</p>
                </div>`;
            });
            content.innerHTML = html;
            panel.style.display = 'block';
        }

        window.onload = init;
    </script>
</body>
</html>
